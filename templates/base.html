<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icon/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icon/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icon/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.zinc.min.css" >
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}" >
    <link rel="alternate" type="application/rss+xml" href="{{ url_for('rss_feed') }}" title="Erik Göransson-Gaspar's Blog">
    <script>
      window.MathJax = {
        output: {
          font: 'mathjax-fira',      // Fira Math: calligraphic italics that suit Alegreya Sans
          mtextInheritFont: true,    // \text{...} inside math uses the body font
          displayOverflow: 'scroll', // wide display equations scroll on narrow screens
        },
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],   // $...$ and \(...\)
          displayMath: [['$$', '$$'], ['\\[', '\\]']], // $$...$$ and \[...\]
          processEscapes: true,         // allows \$ for literal dollar
          processEnvironments: true, // enables envs. like \begin{align}
        }
      };
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="4855e94c-3ea9-4e23-bf11-c70fa47852a9"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js"></script>

    {% block head %}
    <title>Erik Göransson-Gaspar</title>
    {% endblock %}
  </head>

  <body class="container">
    <header class="site-header">
      <h1 class="site-name"><a href="/">Erik Göransson-Gaspar</a></h1>
      <nav class="site-nav" aria-label="Main">
        <a class="icon-link" href="https://www.linkedin.com/in/erik-goransson/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <span class="icon icon-linkedin" aria-hidden="true"></span>
        </a>
        <a class="icon-link" href="https://github.com/ErikGoranssonGaspar" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <span class="icon icon-github" aria-hidden="true"></span>
        </a>
        <a class="icon-link" href="{{ url_for('rss_feed') }}" aria-label="RSS feed">
          <span class="icon icon-rss" aria-hidden="true"></span>
        </a>
      </nav>
    </header>

    <hr class="site-rule">

    <main>
      {% block main %}
      {% endblock %}
    </main>

    <footer class="site-footer">
      <hr class="site-rule">
      <p><a href="mailto:erikedwardgoransson@gmail.com">erikedwardgoransson@gmail.com</a></p>
    </footer>
  </body>
</html>

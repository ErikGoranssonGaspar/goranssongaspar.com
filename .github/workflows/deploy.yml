name: Deploy via SSH
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ssh.eu.pythonanywhere.com
        username: ErikGoranssonGaspar
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ErikGoranssonGaspar/goranssongaspar.com
          git pull origin main
          # Add any additional deployment commands here
          # For example, if you're using virtual environments:
          # source /home/ErikGoranssonGaspar/.virtualenvs/myenv/bin/activate
          # pip install -r requirements.txt
          # python manage.py migrate  # if using Django